# 构建 iWalk 伴侣 App APK
#
# 触发方式：
#   1. 手动触发（workflow_dispatch）：Actions 页面点 "Run workflow"，可选是否发布 Release
#   2. 推送 v* 标签（如 v0.4.1）：自动构建并创建/更新对应 GitHub Release
#
# 签名说明：release 包用 debug keystore 侧载签名（与本地构建一致）。
# 若仓库 Secret 配置了 ANDROID_DEBUG_KEYSTORE_BASE64（本地 ~/.android/debug.keystore
# 的 base64），则使用它以保证签名一致、可覆盖安装；否则在 CI 上生成一个新的
# debug keystore（签名不同，用户需卸载重装）。
name: build-apk

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app_kotlin
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 准备签名 keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "使用仓库 Secret 中的 keystore"
            echo "${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}" | base64 -d > "$HOME/.android/debug.keystore"
          else
            echo "未配置 Secret，生成新的 debug keystore（签名与本地构建不同）"
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: 运行单元测试（protocol / core / app）
        run: ./gradlew --no-daemon :protocol:test :core:test :app:testReleaseUnitTest

      - name: 构建 release APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: 上传构建产物（Artifact）
        uses: actions/upload-artifact@v4
        with:
          name: iwalk-companion-apk
          path: app_kotlin/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: 发布 Release（仅 v* 标签触发时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app_kotlin/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
